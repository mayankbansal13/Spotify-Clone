<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Spotify - Cool Songs but NC</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="icon.png" />
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav>
      <ul>
        <li class="brand">
          <img src="logo.png" alt="Spotify Logo" /> Spotify
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">
      <div class="songList">
        <h1>Cool Songs but NC</h1>
        <div class="songItemContainer">
          <div class="songItem">
            <img src="default.png" alt="On & On" />
            <span class="songName">On & On</span>
            <span class="songlistplay">
              <span class="timestamp">3:28 <i id="0" class="far songItemPlay fa-play-circle" aria-label="Play"></i></span>
            </span>
          </div>
          <div class="songItem">
            <img src="default.png" alt="Invincible" />
            <span class="songName">Invincible</span>
            <span class="songlistplay">
              <span class="timestamp">4:12 <i id="1" class="far songItemPlay fa-play-circle" aria-label="Play"></i></span>
            </span>
          </div>
          <div class="songItem">
            <img src="default.png" alt="Mortals" />
            <span class="songName">Mortals</span>
            <span class="songlistplay">
              <span class="timestamp">3:45 <i id="2" class="far songItemPlay fa-play-circle" aria-label="Play"></i></span>
            </span>
          </div>
          <div class="songItem">
            <img src="default.png" alt="Shine" />
            <span class="songName">Shine</span>
            <span class="songlistplay">
              <span class="timestamp">3:05 <i id="3" class="far songItemPlay fa-play-circle" aria-label="Play"></i></span>
            </span>
          </div>
          <div class="songItem">
            <img src="default.png" alt="Why We Lose" />
            <span class="songName">Why We Lose</span>
            <span class="songlistplay">
              <span class="timestamp">3:58 <i id="4" class="far songItemPlay fa-play-circle" aria-label="Play"></i></span>
            </span>
          </div>
          <div class="songItem">
            <img src="default.png" alt="Sky High" />
            <span class="songName">Sky High</span>
            <span class="songlistplay">
              <span class="timestamp">2:50 <i id="5" class="far songItemPlay fa-play-circle" aria-label="Play"></i></span>
            </span>
          </div>
          <div class="songItem">
            <img src="default.png" alt="Symbolism" />
            <span class="songName">Symbolism</span>
            <span class="songlistplay">
              <span class="timestamp">3:22 <i id="6" class="far songItemPlay fa-play-circle" aria-label="Play"></i></span>
            </span>
          </div>
          <div class="songItem">
            <img src="default.png" alt="Heroes Tonight" />
            <span class="songName">Heroes Tonight</span>
            <span class="songlistplay">
              <span class="timestamp">3:37 <i id="7" class="far songItemPlay fa-play-circle" aria-label="Play"></i></span>
            </span>
          </div>
          <div class="songItem">
            <img src="default.png" alt="Feel Good" />
            <span class="songName">Feel Good</span>
            <span class="songlistplay">
              <span class="timestamp">4:05 <i id="8" class="far songItemPlay fa-play-circle" aria-label="Play"></i></span>
            </span>
          </div>
          <div class="songItem">
            <img src="default.png" alt="My Heart" />
            <span class="songName">My Heart</span>
            <span class="songlistplay">
              <span class="timestamp">3:15 <i id="9" class="far songItemPlay fa-play-circle" aria-label="Play"></i></span>
            </span>
          </div>
        </div>
      </div>
      <div class="songBanner"></div>
    </div>

    <!-- Music Controls -->
    <div class="bottom">
      <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100" />
      <div class="icons">
        <i class="fas fa-3x fa-step-backward" id="previous" aria-label="Previous"></i>
        <i class="far fa-3x fa-play-circle" id="masterPlay" aria-label="Play/Pause"></i>
        <i class="fas fa-3x fa-step-forward" id="next" aria-label="Next"></i>
      </div>
      <div class="songInfo">
        <img src="playing.gif" width="42px" alt="Playing Animation" id="gif" />
        <span id="masterSongName">On & On - Cartoon, Daniel Levi</span>
      </div>
    </div>

    <!-- External Scripts -->
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/26504e4a1f.js" crossorigin="anonymous"></script>
  </body>
</html>
